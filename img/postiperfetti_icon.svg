<!--
  Logo PostiPerfetti — ricostruzione vettoriale, sfondo trasparente.
  Struttura: griglia 2x2 di "banchi".
    · Riga in alto  : banchi VUOTI  = bordo tratteggiato + lettera P
    · Riga in basso : banchi ASSEGNATI = riquadro pieno + spunta bianca
    · Sopra ogni banco: una piccola "linguetta" (stesso colore, semi-trasparente)
  Colori del brand:
    blu  #1565C0   ·   verde #2E7D32   ·   grigio tratteggio #4A5567
  Nota sulla "P": è testo dal vivo in un grassetto senza-grazie. Per renderla
  indipendente dal font (consigliato), aprila in Inkscape e usa
  "Percorso > Oggetto in tracciato".
-->


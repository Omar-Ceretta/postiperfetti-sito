<!DOCTYPE html>
<!-- =============================================================================
     PostiPerfetti — PAGINA "404" (pagina non trovata)
     Da caricare sul server come pagina di errore personalizzata (su
     Netlify viene servita automaticamente per ogni URL
     inesistente, senza bisogno di configurazione aggiuntiva).
     ============================================================================ -->
<html lang="it">
<head>

<!-- La pagina 404 può essere servita da un indirizzo "profondo"
     (es. /cartella/pagina-inesistente), con quell'indirizzo che resta
     nella barra del browser. Questo <base> forza TUTTI i percorsi
     relativi (CSS, JS, immagini, font, link del menu) a ripartire dalla
     radice "/" del sito: così la pagina di errore resta sempre completa
     e navigabile, a qualunque profondità venga richiesta. -->
<base href="/">

<!-- COMPONENT:HEAD -->

<!-- Specifico SOLO di questa pagina: le pagine di errore non vanno indicizzate
     da Google. Se qualcuno linkasse un URL sbagliato, non vogliamo che QUESTA
     pagina finisca nei risultati al posto di quella vera. -->
<meta name="robots" content="noindex">

</head>

<body>

  <!-- COMPONENT:HEADER -->

  <main id="contenuto-principale">

    <section class="caratteristiche errore-404">
      <div class="contenitore">

        <span class="occhiello">Errore 404</span>
        <h1 class="sezione-titolo">Questa pagina non è (ancora) stata assegnata a nessun posto.</h1>
        <p class="sezione-intro">
          Il link che hai seguito potrebbe contenere un errore di battitura, oppure la pagina è stata spostata o rimossa. Succede anche ai
          banchi più ordinati.
        </p>

        <img src="img/omino_404.svg" class="omino" alt="">

        <div class="errore-404-bottoni">
          <a class="btn btn-primario" href="/">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
            Torna alla Home
          </a>
          <a class="btn btn-secondario" href="download.html">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15.75 11.25v3a1.5 1.5 0 0 1 -1.5 1.5H3.75A1.5 1.5 0 0 1 2.25 14.25V11.25"/><path d="M5.25 7.5 9 11.25l3.75 -3.75"/><path d="M9 11.25v-9"/></svg>
            Vai al Download
          </a>
        </div>

      </div>
    </section>

  </main>

  <!-- COMPONENT:FOOTER -->

</body>
</html>
